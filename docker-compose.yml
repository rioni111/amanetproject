# Local infrastructure for Lexora Workspace (Amanet assignment).
# The Laravel API and Next.js app run on the host (php artisan serve / npm run dev);
# this file provides PostgreSQL and Mailpit only.
#
#   docker compose up -d
#
name: amanet-legal-workspace

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: amanet
      POSTGRES_USER: amanet
      POSTGRES_PASSWORD: amanet # development only
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanet -d amanet"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Catches all outgoing email in development (used from Phase 6). UI: http://localhost:8025
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
